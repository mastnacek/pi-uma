name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (test, clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # ast-grep is required by the fail-closed architecture-invariants test.
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Release build
        run: cargo build --release

  typescript:
    name: TypeScript (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
